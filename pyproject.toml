[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26170"
version = "0.1.0"
description = "AI-Driven Anomaly Detection in Component Burn-In & Screening"
authors = [{ name = "SIH26170 Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.pyright]
extraPaths = [".", "src"]

[tool.pyrefly]
search-path = ["src", "."]

